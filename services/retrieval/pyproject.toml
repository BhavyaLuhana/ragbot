[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-retrieval"
version = "0.1.0"
description = "Retrieval service: HyDE → hybrid search → RRF → rerank → generate."
requires-python = ">=3.11"
dependencies = [
    # Internal
    "rag-shared",

    # Vector store (read side) — must match ingestion's chromadb pin
    "chromadb>=0.5,<1",

    # Sparse retrieval
    "rank-bm25>=0.2.2,<1",

    # Cross-encoder reranker (ADR-006)
    "sentence-transformers>=3.0,<4",

    # HTTP API + streaming
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2.1,<3",

    # Outbound HTTP to ingestion service (for /reload future work)
    "httpx>=0.27,<1",

    # Misc
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["retrieval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true