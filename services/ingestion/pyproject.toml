[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Ingestion service: load PDF → chunk → embed → store (Chroma + BM25)."
requires-python = ">=3.11"
dependencies = [
    # Internal
    "rag-shared",

    # PDF loading
    "pypdf>=4.3,<6",

    # Chunking
    "langchain-text-splitters>=0.2,<1",

    # Vector store (ADR-001)
    "chromadb>=0.5,<1",

    # Sparse index (ADR-004)
    "rank-bm25>=0.2.2,<1",

    # HTTP API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",

    # Misc
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services.ingestion*", "ingestion*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true