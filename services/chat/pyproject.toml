[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chat"
version = "0.1.0"
description = "Chat service: session state + orchestration over the retrieval service."
requires-python = ">=3.11"
dependencies = [
    # Internal
    "rag-shared",

    # HTTP API + streaming
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2.1,<3",

    # Outbound HTTP to retrieval service
    "httpx>=0.27,<1",

    # Misc
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chat*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true